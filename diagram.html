<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BUSTRACKERR – User Workflow Block Diagram</title>
  <style>
    body {
      margin: 0;
      padding: 30px;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      font-size: 13px;
      color: #111;
    }

    h2 {
      text-align: center;
      font-size: 18px;
      margin-bottom: 4px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .subtitle {
      text-align: center;
      font-size: 11px;
      color: #555;
      margin-bottom: 30px;
    }

    svg {
      display: block;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ccc;
    }

    /* box styles */
    .box rect {
      stroke-width: 1.5;
      rx: 4;
    }
    .box text {
      font-family: Arial, sans-serif;
      font-size: 12px;
      fill: #111;
    }
    .box text.small {
      font-size: 9.5px;
      fill: #555;
    }
    .box text.api {
      font-family: Consolas, monospace;
      font-size: 9px;
      fill: #1a56a0;
    }
    .arrow line, .arrow path {
      stroke: #555;
      stroke-width: 1.5;
      fill: none;
    }
    .arrow-label {
      font-family: Arial, sans-serif;
      font-size: 9px;
      fill: #333;
    }
    .db-label {
      font-family: Arial, sans-serif;
      font-size: 10px;
      fill: #155724;
      font-weight: bold;
    }
    .section-label {
      font-family: Arial, sans-serif;
      font-size: 10px;
      fill: #888;
      font-style: italic;
    }
  </style>
</head>
<body>

<h2>BUSTRACKERR — User Workflow Block Diagram</h2>
<div class="subtitle">Solapur City Bus Tracker App &nbsp;|&nbsp; React Native (Expo) + Node.js Express + MongoDB</div>
